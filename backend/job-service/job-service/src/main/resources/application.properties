spring.application.name=job-service
server.port=8082

#DataSource - MySQL (own database for this service)
spring.datasource.url=jdbc:mysql://localhost:3306/job_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA
# The schema is created by database/job_db.sql, so Hibernate does not touch it.
# Use "update" instead if you want Hibernate to create/alter the tables itself.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

#Eureka (start eureka-server on port 8761 first)
eureka.client.enabled=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

#Actuator
management.endpoints.web.exposure.include=health,info

#Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
